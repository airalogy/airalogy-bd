name: Release packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airalogy-bd-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'airalogy/airalogy-bd' && (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version: ${{ steps.source.outputs.version }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - name: Check release source
        id: source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node .github/scripts/check-release.mjs
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.12.4
          python-version: '3.12'
          enable-cache: false
      - name: Install pinned package managers and dependencies
        run: |
          npm install --global pnpm@11.20.0 npm@12.2.1 --ignore-scripts
          pnpm install --frozen-lockfile
      - name: Test source
        run: pnpm test
      - name: Test the actual installation package
        run: pnpm test:package --output-dir "$RUNNER_TEMP/npm-artifacts"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: artifact
        with:
          name: verified-npm-package
          path: ${{ runner.temp }}/npm-artifacts/*
          if-no-files-found: error
          retention-days: 14

  image:
    name: Test image (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      RELEASE_REVISION: ${{ github.sha }}
      IMAGE_ARCH: ${{ matrix.arch }}
      BD_TEST_IMAGE: airalogy-bd:test-${{ matrix.arch }}
      BD_TEST_PLATFORM: linux/${{ matrix.arch }}
      BD_TEST_VERSION: ${{ needs.verify.outputs.version }}
      BD_TEST_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.34.0
      - name: Build image without registry credentials
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          load: true
          push: false
          provenance: false
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.BD_TEST_IMAGE }}
          build-args: |
            BD_VERSION=${{ needs.verify.outputs.version }}
            BD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=airalogy-bd-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=airalogy-bd-${{ matrix.arch }},ignore-error=true
      - name: Test exact image (login, backup, restart and restore)
        run: node tests/docker-smoke.mjs
      - name: Export tested image and integrity record
        run: node .github/scripts/image-release.mjs export "$BD_TEST_IMAGE" "$RUNNER_TEMP/image"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: github.event_name == 'release'
    needs: [verify, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # This fresh runner neither checks out source nor executes package scripts.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - run: npm install --global npm@12.2.1 --ignore-scripts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: artifact
          merge-multiple: true
      - name: Verify and publish tested archive with OIDC
        working-directory: artifact
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/publish.npmrc
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          archive="airalogy-airalogy-bd-${RELEASE_VERSION}.tgz"
          printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
          expected=$(cut -d ' ' -f 1 "$archive.sha256")
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --strict
          tar -xOf "$archive" package/package.json > "$RUNNER_TEMP/package.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const p = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/package.json'));
          assert.equal(p.name, '@airalogy/airalogy-bd');
          assert.equal(p.version, process.env.RELEASE_VERSION);
          assert.equal(p.repository.url, 'https://github.com/airalogy/airalogy-bd.git');
          assert.notEqual(p.private, true);
          const r = await fetch(`https://registry.npmjs.org/@airalogy%2fairalogy-bd/${p.version}`, { signal: AbortSignal.timeout(30000) });
          assert.equal(r.status, 404, 'Version already exists or registry is unavailable; refusing to publish');
          NODE
          npm publish "./$archive" --ignore-scripts --access public --registry=https://registry.npmjs.org/
      - name: Verify public registry integrity after npm scanning
        working-directory: artifact
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const version = process.env.RELEASE_VERSION;
          const bytes = readFileSync(`airalogy-airalogy-bd-${version}.tgz`);
          const integrity = 'sha512-' + createHash('sha512').update(bytes).digest('base64');
          for (let attempt = 0; attempt < 80; attempt++) {
            const response = await fetch(`https://registry.npmjs.org/@airalogy%2fairalogy-bd/${version}`, { headers: { 'cache-control': 'no-cache' }, signal: AbortSignal.timeout(30000) });
            if (response.ok) {
              const metadata = await response.json();
              assert.equal(metadata.version, version);
              assert.equal(metadata.dist.integrity, integrity);
              console.log(`Public npm package ${version} matches the tested archive.`);
              process.exit(0);
            }
            assert.ok(response.status === 404 || response.status === 429 || response.status >= 500, `Unexpected registry response: ${response.status}`);
            await new Promise(resolve => setTimeout(resolve, 15000));
          }
          throw new Error('npm accepted the publish but public verification timed out. Inspect the registry; do not republish this version.');
          NODE

  publish-image:
    name: Publish image (${{ matrix.arch }})
    if: github.event_name == 'release'
    needs: [verify, image, publish]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: npm
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      RELEASE_REVISION: ${{ github.sha }}
      IMAGE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.34.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: tested-image-${{ matrix.arch }}
          path: image
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Load and push the tested archive. Never rebuild or run application code here.
      - run: node .github/scripts/image-release.mjs push image "$RUNNER_TEMP/published"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/published/*
          if-no-files-found: error
          retention-days: 7

  image-manifest:
    if: github.event_name == 'release'
    needs: [verify, publish-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.manifest.outputs.image }}
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      RELEASE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.34.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: published-image-*
          path: manifests
          merge-multiple: true
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish one version for both tested architectures
        id: manifest
        run: node .github/scripts/image-release.mjs merge manifests "$RUNNER_TEMP/image.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image
          path: ${{ runner.temp }}/image.json
          if-no-files-found: error
          retention-days: 14

  public-image:
    name: Verify public pull (${{ matrix.arch }})
    needs: [verify, image-manifest]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      IMAGE: ${{ needs.image-manifest.outputs.image }}
      PLATFORM: linux/${{ matrix.arch }}
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      RELEASE_REVISION: ${{ github.sha }}
    steps:
      - name: Verify anonymous installation of the published image
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
        run: |
          mkdir -p "$DOCKER_CONFIG"
          printf '{}\n' > "$DOCKER_CONFIG/config.json"
          docker pull --platform "$PLATFORM" "$IMAGE" || {
            echo 'Public pull failed. For the first publication, set the GHCR package visibility to Public, then rerun failed jobs.'
            exit 1
          }
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$RELEASE_VERSION"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$RELEASE_REVISION"
          test "$(docker run --rm --network none --platform "$PLATFORM" --entrypoint node "$IMAGE" -p "require('/opt/bd/package.json').version")" = "$RELEASE_VERSION"

  release-assets:
    if: github.event_name == 'release'
    needs: [verify, publish, image-manifest, public-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.2
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verified-npm-package
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-image
          path: ${{ runner.temp }}/release
      - name: Attach the npm package, deployment bundle and image digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-assets.mjs "$RUNNER_TEMP/release"
